<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Week 2 API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { color: #0B2A5B; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    li { margin: 8px 0; }

<body>
  <h1>My Week 2 API!</h1>
  <p>Built with Node.js and Express. Available routes:</p>
  <ul>
    <li><code>GET /</code> returns "My Week 2 API!" (curl/Postman)</li>
    <li><code>POST /user</code> with <code>{"name","email"}</code> returns "Hello, [name]!"</li>
    <li><code>GET /user/:id</code> returns "User [id] profile"</li>
  </ul>
</body>
